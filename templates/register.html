<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>Register — VerifySMS</title>
<meta name="description" content="Buy temporary virtual phone numbers from 180+ countries instantly. No SIM needed. Pay with Paystack. Privacy-first SMS verification.">
<meta name="author" content="VerifySMS">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#f97316">

<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="shortcut icon" href="assets/img/favicon.svg">
<link rel="apple-touch-icon" href="assets/img/favicon.svg">

<meta property="og:type" content="website">
<meta property="og:site_name" content="VerifySMS">
<meta property="og:title" content="Register — VerifySMS">
<meta property="og:description" content="Buy temporary virtual phone numbers from 180+ countries instantly. No SIM needed. Pay with Paystack. Privacy-first SMS verification.">
<meta property="og:image" content="assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Register — VerifySMS">
<meta name="twitter:description" content="Buy temporary virtual phone numbers from 180+ countries instantly. No SIM needed. Pay with Paystack. Privacy-first SMS verification.">
<meta name="twitter:image" content="assets/img/og-image.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <div class="auth-site-name">VerifySMS</div>
      <div class="auth-subtitle">Create your free account</div>
    </div>

    <form method="POST" action="/register.html" onsubmit="setLoading(this, true)">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-control" type="text" name="name" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-control" type="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" placeholder="Min. 6 characters" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input class="form-control" type="password" name="confirm" placeholder="Repeat password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </button>
    </form>

    <div class="auth-footer-link">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>
<script src="assets/js/app.js"></script>
</body>
</html>
