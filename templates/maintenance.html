<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Maintenance — VerifySMS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--orange:#f97316;--bg:#06091a;--text:#e2e8f0;--muted:#8fa4c0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
h1{font-weight:700;font-size:2rem;margin-bottom:10px}
p{color:var(--muted);max-width:400px;line-height:1.7}
.icon{font-size:3.5rem;color:var(--orange);margin-bottom:20px;opacity:.8}
</style>
</head>
<body>
  <div>
    <div class="icon"><i class="fa-solid fa-wrench"></i></div>
    <h1>VerifySMS is under maintenance</h1>
    <p>We're making improvements. We'll be back shortly. Thank you for your patience.</p>
  </div>
</body>
</html>
