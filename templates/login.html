<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>Sign In — VerifySMS</title>
<meta name="description" content="Buy temporary virtual phone numbers from 180+ countries instantly. No SIM needed. Pay with Paystack. Privacy-first SMS verification.">
<meta name="author" content="VerifySMS">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#f97316">

<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="shortcut icon" href="assets/img/favicon.svg">
<link rel="apple-touch-icon" href="assets/img/favicon.svg">

<meta property="og:type" content="website">
<meta property="og:site_name" content="VerifySMS">
<meta property="og:title" content="Sign In — VerifySMS">
<meta property="og:description" content="Buy temporary virtual phone numbers from 180+ countries instantly. No SIM needed. Pay with Paystack. Privacy-first SMS verification.">
<meta property="og:image" content="assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sign In — VerifySMS">
<meta name="twitter:description" content="Buy temporary virtual phone numbers from 180+ countries instantly. No SIM needed. Pay with Paystack. Privacy-first SMS verification.">
<meta name="twitter:image" content="assets/img/og-image.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <div class="auth-site-name">VerifySMS</div>
      <div class="auth-subtitle">Welcome back — sign in to your account</div>
    </div>

    <!-- Example error state (hidden by default) -->
    <!--
    <div class="alert alert-danger"><i class="fa-solid fa-exclamation-circle"></i> Invalid email or password.</div>
    -->

    <form method="POST" action="/login.html" onsubmit="setLoading(this, true)">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-control" type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:4px">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
      </button>
    </form>

    <div class="auth-footer-link">
      Don't have an account? <a href="register.html">Create one</a>
    </div>
  </div>
</div>
<script src="assets/js/app.js"></script>
</body>
</html>
